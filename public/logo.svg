<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <defs>
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e0c" />
      <stop offset="100%" stop-color="#0a0505" />
    </linearGradient>
    <linearGradient id="mainGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <rect width="240" height="200" rx="40" fill="url(#mainBg)" stroke="url(#mainGold)" stroke-width="4" />
  <!-- Combined Coffee & Pastry Emblem -->
  <g transform="translate(45, 25)">
    <!-- Coffee Cup -->
    <path d="M20 50 H90 V85 C90 105 75 118 55 118 C35 118 20 105 20 85 Z" fill="none" stroke="url(#mainGold)" stroke-width="6" stroke-linecap="round" />
    <path d="M90 60 C105 60 110 70 110 78 C110 88 100 93 90 93" fill="none" stroke="url(#mainGold)" stroke-width="5" />
    <!-- Heart steam -->
    <path d="M55 25 C50 15 38 18 38 28 C38 40 55 52 55 52 C55 52 72 40 72 28 C72 18 60 15 55 25 Z" fill="url(#mainGold)" />
    <!-- Sparkles -->
    <circle cx="120" cy="30" r="3" fill="#fde047" />
    <circle cx="10" cy="35" r="2.5" fill="#fde047" />
  </g>
  <!-- Brand Text -->
  <text x="120" y="160" font-family="'Cairo', sans-serif" font-weight="900" font-size="16" fill="url(#mainGold)" text-anchor="middle">أبو عادل &amp; سول ميت</text>
  <text x="120" y="180" font-family="sans-serif" font-weight="700" font-size="9" fill="#fde68a" text-anchor="middle" letter-spacing="1">PATISSERIE &amp; SPECIALTY CAFE</text>
</svg>
